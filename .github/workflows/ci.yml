name: CI - Build and Update GitOps

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to which environment?'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        id: build
        run: |
          TAG=${{ github.sha }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cake-app:$TAG .
          docker push ${{ secrets.DOCKER_USERNAME }}/cake-app:$TAG
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

  # push main → 自动发布 dev + staging
  deploy-dev-staging:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging]
    steps:
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Render and push for ${{ matrix.env }}
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          git clone https://${{ secrets.GH_PAT }}@github.com/sven110sugar/cake-gitops-manifests.git
          cd cake-gitops-manifests
          rm -rf ${{ matrix.env }}/rendered
          mkdir -p ${{ matrix.env }}/rendered
          helm template cake-app charts/cake-app \
            -f ${{ matrix.env }}/values.yaml \
            --set image.tag=$TAG \
            --output-dir ${{ matrix.env }}/rendered \
            --include-crds
          git config user.name "CI Bot"
          git config user.email "ci@bot.com"
          git add ${{ matrix.env }}/rendered/
          git commit -m "[${{ matrix.env }}] Update image to $TAG" || echo "No changes, skipping"
          git push

  # workflow_dispatch 选环境 → 手动发布到指定环境(含 prod)
  deploy-manual:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Render and push for ${{ inputs.environment }}
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          ENV=${{ inputs.environment }}
          git clone https://${{ secrets.GH_PAT }}@github.com/sven110sugar/cake-gitops-manifests.git
          cd cake-gitops-manifests
          rm -rf $ENV/rendered
          mkdir -p $ENV/rendered
          helm template cake-app charts/cake-app \
            -f $ENV/values.yaml \
            --set image.tag=$TAG \
            --output-dir $ENV/rendered \
            --include-crds
          git config user.name "CI Bot"
          git config user.email "ci@bot.com"
          git add $ENV/rendered/
          git commit -m "[$ENV] Update image to $TAG" || echo "No changes, skipping"
          git push
